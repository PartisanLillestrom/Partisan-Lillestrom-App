name: Hent kampresultater

on:
  schedule:
    # Én kjøring i timen, hele uka. Dette erstatter en liste med
    # kamptidspunkter for fredag/lørdag/søndag, som hadde tre problemer:
    #
    #   1. Siste lørdagskjøring lå 21:30 norsk vintertid, mens en kamp med
    #      avspark 20:30 ikke er ferdig før rundt 22:20. Resultatet kom
    #      først søndag ettermiddag.
    #   2. Midtukekamper (f.eks. Karlsruher SC onsdag 3. mars) hadde ingen
    #      kjøring i det hele tatt - resultatet kom to døgn senere.
    #   3. Tidene var skrevet i sommertid, så alt forskjøv seg en time
    #      hver gang klokka ble stilt.
    #
    # Timeplanen koster ingenting: repoet er offentlig, så Actions-minutter
    # er gratis, og skriptet skriver bare til Firebase når et resultat
    # faktisk har endret seg. Overbooking er dessuten en fordel - GitHub
    # forsinker og dropper planlagte kjøringer, så flere forsøk gir
    # jevnere oppdatering. Minutt 25 unngår køen på :00.
    - cron: '25 * * * *'
  # Manuell kjøring
  workflow_dispatch:

# Skriptet leser repoet og skriver bare til Firebase, ikke til GitHub.
permissions:
  contents: read

jobs:
  hent-resultater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: pip install cryptography

      - name: Hent resultater fra OpenLigaDB
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/hent_resultater.py
