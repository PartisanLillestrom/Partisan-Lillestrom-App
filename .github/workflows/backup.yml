name: Firebase backup

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Skriptet leser repoet og skriver backupen som artifact, ikke til GitHub.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: pip install cryptography

      - name: Ta backup av Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/backup_database.py

      - name: Last opp backup som artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebase-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
